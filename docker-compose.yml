services:
  # ---------------------------------------------------------------------------
  # Servidor Ollama: Motor LLM local para redacción empática agronómica (Gemma 4)
  # ---------------------------------------------------------------------------
  croply-ollama:
    image: ollama/ollama:latest
    container_name: croply-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    env_file:
      - .env
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_storage:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/scripts/ollama-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/scripts/ollama-entrypoint.sh"]
    networks:
      - croply-network
    # -------------------------------------------------------------------------
    # Habilitación opcional de aceleración por GPU NVIDIA:
    # Descomentar el siguiente bloque si el host dispone de NVIDIA Container Toolkit
    # -------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Servicio de IA FastAPI: Inferencia LightGBM + SHAP + Orquestador LLM
  # ---------------------------------------------------------------------------
  croply-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: croply-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://croply-ollama:11434}
      - OLLAMA_URL=${OLLAMA_BASE_URL:-http://croply-ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-75.0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30.0}
    depends_on:
      - croply-ollama
    networks:
      - croply-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ollama_storage:
    name: croply_ollama_storage

networks:
  croply-network:
    name: croply-network
    driver: bridge
